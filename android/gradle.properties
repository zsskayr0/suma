android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental-compilation cache can't relativize paths across two
# different drive letters (e.g. project on D:, Gradle/pub caches on C:),
# which crashes compileDebugKotlin. Disabling it trades a bit of rebuild
# speed for builds that actually complete.
kotlin.incremental=false
